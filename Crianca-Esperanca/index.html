<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criança Esperança</title>
    <link rel="stylesheet" href="style/index.css">
</head>

<body>
    <header>
        <h1>Criança Esperança</h1>
    </header>
    <main class="card">
        <section id="h2sesao">
            <h2>Obrigado por ajudar</h2>
        </section>
        <section id="sesaoform">
            <form id="form">
                <select name="doar" id="doar">
                    <option value="1">para doar 10$</option>
                    <option value="2">para doar 25$</option>
                    <option value="3">para doar 50$</option>
                    <option value="4">para doar outors valores</option>
                    <option value="5">para cancelar</option>
                </select>
                <button type="submit" id="btn-confirmar">Confirmar</button>
            </form>
        </section>
        <section id="sesaoresultado">
            <p id="resultado"></p>
        </section>
    </main>
    <footer>
        <p>feito por PedroAlexandreFS</p>
    </footer>

    <script src="js/index.js"></script>
</body>

</html>
